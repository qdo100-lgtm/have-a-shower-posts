name: 표지 사진 받기

on:
  push:
    branches: [main]
    paths:
      - "briefs/images/**/queries.txt"
  workflow_dispatch:
    inputs:
      file:
        description: "검색어 파일 (예: briefs/images/2026-11-08/queries.txt)"
        required: true

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 사진 받기
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: |
          if [ -n "${{ inputs.file }}" ]; then
            files="${{ inputs.file }}"
          else
            files=$(git diff --name-only HEAD~1 HEAD -- 'briefs/images/**/queries.txt')
          fi
          for f in $files; do python scripts/fetch_photos.py "$f"; done
      - name: 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add briefs/images
          git commit -m "표지 사진 받기" || exit 0
          git pull --rebase -q
          git push
