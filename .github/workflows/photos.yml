name: 표지 사진 받기

on:
  push:
    branches: [main]
    paths:
      - "briefs/images/**/queries.txt"
      - "briefs/images/**/products.txt"
  workflow_dispatch:
    inputs:
      file:
        description: "검색어 파일 (예: briefs/images/2026-11-08/queries.txt)"
        required: true

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 사진 받기
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: |
          if [ -n "${{ inputs.file }}" ]; then
            files="${{ inputs.file }}"
          else
            files=$(git diff --name-only HEAD~1 HEAD -- 'briefs/images/**/queries.txt')
          fi
          for f in $files; do [ "$(basename $f)" = queries.txt ] && python scripts/fetch_photos.py "$f" || true; done
      - name: 제품 사진 받기
        run: |
          if [ -n "${{ inputs.file }}" ]; then
            files=$(dirname "${{ inputs.file }}")/products.txt
          else
            files=$(git diff --name-only HEAD~1 HEAD -- 'briefs/images/**/products.txt')
          fi
          for f in $files; do [ -f "$f" ] && python scripts/fetch_products.py "$f" || true; done
      - name: 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add briefs/images
          git commit -m "표지 사진 받기" || exit 0
          git pull --rebase -q
          git push
