name: 반응 확인

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 숫자 가져오기
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/insights.py
      - name: 결과 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add insights/latest.json
          git commit -m "반응 확인" || exit 0
          git push
